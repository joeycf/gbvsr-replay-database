<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the image generators (scripts/og.ts, scripts/art.ts).

  The @fontsource packages ship only .woff/.woff2, which fontconfig does not
  read, so the display and UI faces are invisible to sharp/librsvg unless they
  are provided as real font files. `fc-match "Cinzel Decorative"` on a clean
  machine answers with a plausible fallback, silently — checklist 5d's whole
  point.

  The four OFL TTFs beside this file are committed for exactly that reason,
  fetched 2026-09-29 and verified in-session against their own cmap tables
  (no fvar table, so they are static faces librsvg can use):

    CinzelDecorative-Bold.ttf, -Black.ttf  github.com/google/fonts, ofl/cinzeldecorative
                                           (OFL.txt beside them), 351 codepoints
    Figtree-Regular.ttf, -Bold.ttf         the same files Avatar committed from
                                           github.com/erikdkennedy/figtree

  5d NEEDS TWO PROBE STRINGS, and the latin one must include LOWERCASE and the
  digits in the VENDOR's form, not an ASCII proxy:

    latin      "2B ID AVATAR BELIAL Granblue Rising Replay 0123456789 3–2 · '"
    latin-ext  a codepoint >= U+0100 — "ō" (U+014D)

  Cinzel Decorative has NO small caps (measured 2026-09-29, scripts/og.ts):
  its lowercase codepoints draw the plain Roman capitals at full cap height and
  its uppercase draws the swash capitals — so the lowercase words in the probe
  prove the face by drawing DIFFERENTLY from its own capitals, which a fallback
  serif would not do. A probe of capitals only proves nothing. "2B" is the roster's one digit-leading name: the digit must come
  from the display face, and it does (verified in the cmap of both the TTFs and
  the @fontsource latin subset the site serves).
-->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.fc-cache</cachedir>
</fontconfig>
